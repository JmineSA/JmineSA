@keyframes upc{from{opacity:0}to{opacity:1}}
.bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:gr 1s ease-out forwards}
@keyframes gr{to{transform:scaleX(1)}}
.card:hover{opacity:1}
