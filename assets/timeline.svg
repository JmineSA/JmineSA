<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Career timeline: Local Butcher Shop 2024, Studio Intelligence AI 2024 to 2025, Telecom Consumption Intelligence project 2026">
<defs><linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="1120" y2="0"><stop offset="0" stop-color="#22c55e"/><stop offset="0.5" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<style>.ln{stroke-dasharray:1040;stroke-dashoffset:1040;animation:dr 3.6s .3s ease-out forwards}@keyframes dr{to{stroke-dashoffset:0}}
.n{opacity:0;animation:fi .8s ease-out forwards}@keyframes fi{to{opacity:1}}
.rg{transform-box:fill-box;transform-origin:center;animation:rp 3s ease-out infinite}@keyframes rp{0%{transform:scale(1);opacity:.8}60%,100%{transform:scale(1.9);opacity:0}}</style></defs>
<rect width="1200" height="170" rx="16" fill="#0b1220"/>
<line x1="80" y1="62" x2="1120" y2="62" stroke="#1e2d45" stroke-width="3"/>
<line class="ln" x1="80" y1="62" x2="1120" y2="62" stroke="url(#tg)" stroke-width="3" stroke-linecap="round"/>
<g class="n" style="animation-delay:0.5s">
<circle class="rg" cx="200" cy="62" r="16" fill="none" stroke="#22c55e" style="animation-delay:1.3s"/>
<circle cx="200" cy="62" r="11" fill="#0b1220" stroke="#22c55e" stroke-width="3"/><circle cx="200" cy="62" r="4.5" fill="#22c55e"/>
<text x="200" y="30" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#22c55e" letter-spacing="1">2024</text>
<text x="200" y="105" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Local Butcher Shop</text>
<text x="200" y="128" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8">Data Analytics Consultant</text>
<text x="200" y="150" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#22c55e">A/B testing: +15% conversions</text></g><g class="n" style="animation-delay:1.6s">
<circle class="rg" cx="600" cy="62" r="16" fill="none" stroke="#38bdf8" style="animation-delay:2.4s"/>
<circle cx="600" cy="62" r="11" fill="#0b1220" stroke="#38bdf8" stroke-width="3"/><circle cx="600" cy="62" r="4.5" fill="#38bdf8"/>
<text x="600" y="30" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">2024–2025</text>
<text x="600" y="105" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Studio Intelligence AI</text>
<text x="600" y="128" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8">Data Science Consultant</text>
<text x="600" y="150" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#38bdf8">Forecasting &amp; retention modelling</text></g><g class="n" style="animation-delay:2.7s">
<circle class="rg" cx="1000" cy="62" r="16" fill="none" stroke="#a78bfa" style="animation-delay:3.5s"/>
<circle cx="1000" cy="62" r="11" fill="#0b1220" stroke="#a78bfa" stroke-width="3"/><circle cx="1000" cy="62" r="4.5" fill="#a78bfa"/>
<text x="1000" y="30" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#a78bfa" letter-spacing="1">2026</text>
<text x="1000" y="105" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Telecom Consumption Intelligence</text>
<text x="1000" y="128" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8">Portfolio project (simulated data)</text>
<text x="1000" y="150" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#a78bfa">End-to-end forecasting app</text></g>
</svg>