<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-label="Turning data into decisions">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0c3a4a"/></linearGradient>
<style>.w1{animation:w 14s linear infinite}.w2{animation:w 9s linear infinite reverse}@keyframes w{to{transform:translateX(-600px)}}
.q{opacity:0;animation:qf 1.4s .2s ease-out forwards}@keyframes qf{to{opacity:1}}</style></defs>
<rect width="1200" height="130" fill="url(#bg)"/>
<g class="w1" opacity="0.25"><path d="M0 90 Q150 60 300 90 T600 90 T900 90 T1200 90 T1500 90 T1800 90 V130 H0Z" fill="#38bdf8"/></g>
<g class="w2" opacity="0.18"><path d="M0 100 Q150 75 300 100 T600 100 T900 100 T1200 100 T1500 100 T1800 100 V130 H0Z" fill="#22c55e"/></g>
<text class="q" x="600" y="52" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#f1f5f9">Turning data into decisions.</text>
</svg>