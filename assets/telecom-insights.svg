<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Telecom project results: 57.9 percent of test observations underpredicted and 42.1 percent overpredicted; R7.34 million top-up revenue opportunity versus R7.12 million over-allocation cost; 30-day rolling average correlation 0.866">
<style>
.a{opacity:0;animation:fi .9s ease-out forwards}@keyframes fi{to{opacity:1}}
.s1{stroke-dasharray:0 439.8;animation:g1 1.6s .5s ease-out forwards}@keyframes g1{to{stroke-dasharray:254.7 439.8}}
.s2{stroke-dasharray:0 439.8;animation:g2 1.2s 1.6s ease-out forwards}@keyframes g2{to{stroke-dasharray:185.2 439.8}}
.b1{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:bg 1.4s .8s cubic-bezier(.2,.7,.2,1) forwards}
.b2{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:bg 1.4s 1.0s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes bg{to{transform:scaleX(1)}}
.gg{stroke-dasharray:0 251.3;animation:gga 1.8s 1.2s ease-out forwards}@keyframes gga{to{stroke-dasharray:217.6 251.3}}
</style>
<rect width="1200" height="330" rx="16" fill="#0b1220" stroke="#1e2d45"/>
<text x="32" y="40" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">TELECOM CONSUMPTION INTELLIGENCE  ·  TEST-SET RESULTS (SIMULATED DATA)</text>

<g transform="translate(190,190)">
<circle r="70" fill="none" stroke="#14223a" stroke-width="26"/>
<g transform="rotate(-90)"><circle class="s1" r="70" fill="none" stroke="#38bdf8" stroke-width="26"/></g>
<g transform="rotate(118.44)"><circle class="s2" r="70" fill="none" stroke="#f59e0b" stroke-width="26"/></g>
<text class="a" y="-2" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#f1f5f9" style="animation-delay:1s">94.2K</text>
<text class="a" y="20" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8" style="animation-delay:1s">test observations</text>
</g>
<g font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0"><rect x="92" y="286" width="12" height="12" rx="3" fill="#38bdf8"/><text x="110" y="297">Under 57.9%</text><rect x="214" y="286" width="12" height="12" rx="3" fill="#f59e0b"/><text x="232" y="297">Over 42.1%</text></g>

<g transform="translate(400,0)">
<text x="0" y="86" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Estimated business effect of prediction errors</text>
<text x="0" y="128" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">Underpredicted · top-up revenue opportunity</text>
<rect x="0" y="138" width="380" height="22" rx="6" fill="#14223a"/>
<rect class="b1" x="0" y="138" width="380" height="22" rx="6" fill="#38bdf8"/>
<text class="a" x="392" y="155" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#38bdf8" style="animation-delay:1.8s">R7.34M</text>
<text x="0" y="214" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">Overpredicted · potential network over-allocation cost</text>
<rect x="0" y="224" width="380" height="22" rx="6" fill="#14223a"/>
<rect class="b2" x="0" y="224" width="369" height="22" rx="6" fill="#f59e0b"/>
<text class="a" x="381" y="241" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#f59e0b" style="animation-delay:2s">R7.12M</text>
<text x="0" y="290" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">Model-based estimates under the project's assumptions, not audited financial results.</text>
</g>

<g transform="translate(1050,205)">
<path d="M-80 0 A80 80 0 0 1 80 0" fill="none" stroke="#14223a" stroke-width="18" stroke-linecap="round"/>
<path class="gg" d="M-80 0 A80 80 0 0 1 80 0" fill="none" stroke="#22c55e" stroke-width="18" stroke-linecap="round"/>
<text class="a" y="-10" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#f1f5f9" style="animation-delay:1.6s">0.866</text>
<text y="30" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">30-day rolling average</text>
<text y="48" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">correlation with predicted usage</text>
</g>
</svg>