<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="GitHub statistics: contributions, streaks, repositories and top languages">
<style>.a{opacity:0;animation:fi .9s ease-out forwards}@keyframes fi{to{opacity:1}}
.bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:g 1.2s cubic-bezier(.2,.7,.2,1) forwards}@keyframes g{to{transform:scaleX(1)}}
.glow{animation:gl 3.5s ease-in-out infinite}@keyframes gl{50%{opacity:.55}}</style>
<defs><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs>
<rect width="1200" height="280" rx="16" fill="#0b1220" stroke="#1e2d45"/>
<g class="a" transform="translate(48,0)">
<text x="0" y="46" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">TOTAL CONTRIBUTIONS</text>
<text class="glow" x="0" y="130" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#n)">179</text>
<text x="0" y="158" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8">in the last year</text>
<text x="0" y="214" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#cbd5e1"><tspan font-weight="700" fill="#38bdf8">122</tspan> commits  ·  <tspan font-weight="700" fill="#f59e0b">19</tspan> PRs  ·  <tspan font-weight="700" fill="#a78bfa">0</tspan> issues</text>
</g>
<line x1="420" y1="40" x2="420" y2="240" stroke="#1e2d45"/>
<g class="a" transform="translate(440,0)" style="animation-delay:.3s"><text x="0" y="46" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">STREAKS &amp; REPOS</text><text x="0" y="86" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8">Current streak</text><text x="300" y="86" text-anchor="end" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#22c55e">3 days</text><text x="0" y="126" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8">Longest streak</text><text x="300" y="126" text-anchor="end" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#38bdf8">5 days</text><text x="0" y="166" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8">Public repositories</text><text x="300" y="166" text-anchor="end" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#a78bfa">14</text><text x="0" y="206" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8">Pull requests</text><text x="300" y="206" text-anchor="end" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#f59e0b">19</text></g>
<line x1="790" y1="40" x2="790" y2="240" stroke="#1e2d45"/>
<g class="a" transform="translate(830,0)" style="animation-delay:.6s"><text x="0" y="46" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">TOP LANGUAGES</text><text x="0" y="78" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Jupyter Notebook</text>
<text x="320" y="78" text-anchor="end" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">97.4%</text>
<rect x="0" y="86" width="320" height="8" rx="4" fill="#14223a"/>
<rect class="bar" x="0" y="86" width="312" height="8" rx="4" fill="#DA5B0B" style="animation-delay:0.50s"/><text x="0" y="116" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Python</text>
<text x="320" y="116" text-anchor="end" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">1.5%</text>
<rect x="0" y="124" width="320" height="8" rx="4" fill="#14223a"/>
<rect class="bar" x="0" y="124" width="6" height="8" rx="4" fill="#3572A5" style="animation-delay:0.65s"/><text x="0" y="154" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">JavaScript</text>
<text x="320" y="154" text-anchor="end" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">0.4%</text>
<rect x="0" y="162" width="320" height="8" rx="4" fill="#14223a"/>
<rect class="bar" x="0" y="162" width="6" height="8" rx="4" fill="#f1e05a" style="animation-delay:0.80s"/><text x="0" y="192" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">CSS</text>
<text x="320" y="192" text-anchor="end" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">0.4%</text>
<rect x="0" y="200" width="320" height="8" rx="4" fill="#14223a"/>
<rect class="bar" x="0" y="200" width="6" height="8" rx="4" fill="#663399" style="animation-delay:0.95s"/><text x="0" y="230" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">HTML</text>
<text x="320" y="230" text-anchor="end" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">0.3%</text>
<rect x="0" y="238" width="320" height="8" rx="4" fill="#14223a"/>
<rect class="bar" x="0" y="238" width="6" height="8" rx="4" fill="#e34c26" style="animation-delay:1.10s"/></g>
</svg>