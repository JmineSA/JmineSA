<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-label="Workflow from business question to decision and impact">
<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="1090" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
<style>.ring{transform-box:fill-box;transform-origin:center;animation:r 4.5s ease-out infinite}
@keyframes r{0%{transform:scale(1);opacity:.8}25%,100%{transform:scale(1.9);opacity:0}}
.flow{stroke-dasharray:6 8;animation:d 1.2s linear infinite}@keyframes d{to{stroke-dashoffset:-14}}</style></defs>
<rect width="1200" height="130" rx="16" fill="#0b1220"/>
<line class="flow" x1="110" y1="56" x2="1090" y2="56" stroke="url(#g)" stroke-width="2.5"/>
<g><circle class="ring" cx="110" cy="56" r="22" fill="none" stroke="#38bdf8" style="animation-delay:0.0s"/>
<circle cx="110" cy="56" r="22" fill="#0f1b2d" stroke="#38bdf8" stroke-width="2"/>
<text x="110" y="62" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#38bdf8">1</text>
<text x="110" y="105" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Business question</text></g><g><circle class="ring" cx="355" cy="56" r="22" fill="none" stroke="#38bdf8" style="animation-delay:0.9s"/>
<circle cx="355" cy="56" r="22" fill="#0f1b2d" stroke="#38bdf8" stroke-width="2"/>
<text x="355" y="62" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#38bdf8">2</text>
<text x="355" y="105" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Data &amp; features</text></g><g><circle class="ring" cx="600" cy="56" r="22" fill="none" stroke="#38bdf8" style="animation-delay:1.8s"/>
<circle cx="600" cy="56" r="22" fill="#0f1b2d" stroke="#38bdf8" stroke-width="2"/>
<text x="600" y="62" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#38bdf8">3</text>
<text x="600" y="105" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Model</text></g><g><circle class="ring" cx="845" cy="56" r="22" fill="none" stroke="#38bdf8" style="animation-delay:2.7s"/>
<circle cx="845" cy="56" r="22" fill="#0f1b2d" stroke="#38bdf8" stroke-width="2"/>
<text x="845" y="62" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#38bdf8">4</text>
<text x="845" y="105" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Error analysis</text></g><g><circle class="ring" cx="1090" cy="56" r="22" fill="none" stroke="#22c55e" style="animation-delay:3.6s"/>
<circle cx="1090" cy="56" r="22" fill="#0f1b2d" stroke="#22c55e" stroke-width="2"/>
<text x="1090" y="62" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#22c55e">5</text>
<text x="1090" y="105" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Decision &amp; impact</text></g>
<circle r="6" fill="#f8fafc"><animateMotion dur="5s" repeatCount="indefinite" path="M110 56 L1090 56"/></circle>
</svg>